<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Energético Interactivo de Argentina 🇦🇷</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/SJPdeE+R0ONzB/A4z/x="
          crossorigin=""/>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20n6a9c9f4850c9096131c90538059c986987c63="
            crossorigin=""></script>
</head>
<body>

    <header>
        <h1>⚡ Mapa Energético de Argentina 🇦🇷</h1>
        <p>Explora las principales fuentes de generación de energía.</p>
    </header>

    <div id="controls-panel">
        <h2>Filtro de Energía</h2>
        <div id="filters">
            <label><input type="checkbox" id="filtro-eolica" checked> 🌀 Eólica</label>
            <label><input type="checkbox" id="filtro-solar" checked> ☀️ Solar</label>
            <label><input type="checkbox" id="filtro-hidro" checked> 💧 Hidroeléctrica</label>
            <label><input type="checkbox" id="filtro-nuclear" checked> ⚛️ Nuclear</label>
            <label><input type="checkbox" id="filtro-biomasa" checked> 🌱 Biomasa</label>
        </div>
    </div>

    <div id="map"></div>

    <footer>
        <p>Datos simulados para demostración. Creado para fines educativos.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
